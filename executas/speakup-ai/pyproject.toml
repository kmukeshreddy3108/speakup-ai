[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-speakup-ai"
version = "0.1.0"
description = "Executa for the speakup-ai Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-speakup-ai" = "speakup_ai_plugin:main"

[tool.setuptools]
py-modules = ["speakup_ai_plugin"]
